name: release
# Push a tag such as v1.9 to build DockBuddy.apk and DockBuddy.Server.exe and publish them as a GitHub release.
# The tag must match versionName in android/app/build.gradle (v1.9 <-> "1.9").
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Check the tag matches the app version
        run: |
          name=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' android/app/build.gradle)
          if [ "v$name" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $name in android/app/build.gradle"
            exit 1
          fi
      # Optional: add repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and
      # ANDROID_KEY_PASSWORD to sign with a stable key. Without them the APK gets a throw-away debug key, and phones
      # must uninstall the old app before installing a release signed with a different key.
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "DOCKBUDDY_KEYSTORE=$RUNNER_TEMP/release.jks"
              echo "DOCKBUDDY_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
              echo "DOCKBUDDY_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
              echo "DOCKBUDDY_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
            } >> "$GITHUB_ENV"
          fi
      - working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk DockBuddy.apk
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: DockBuddy.apk }

  server:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      # The server embeds the APK so it can update phones remotely.
      - uses: actions/download-artifact@v4
        with: { name: apk, path: dist }
      - working-directory: server/DockBuddy.Server
        run: >
          dotnet publish -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o ../publish
      - uses: actions/upload-artifact@v4
        with: { name: server, path: server/publish/DockBuddy.Server.exe }

  release:
    needs: [apk, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: apk, path: out }
      - uses: actions/download-artifact@v4
        with: { name: server, path: out }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/DockBuddy.Server.exe
            out/DockBuddy.apk
          generate_release_notes: true
