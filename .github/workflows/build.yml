name: build
on: [push, pull_request]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - working-directory: android
        run: ./gradlew assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with: { name: dockbuddy-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - working-directory: server/DockBuddy.Server
        run: dotnet publish -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o ../publish
      - uses: actions/upload-artifact@v4
        with: { name: dockbuddy-server, path: server/publish/DockBuddy.Server.exe }
